
<!DOCTYPE html>

<title>نبیگ‌های مهردار | مهردار</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #0f0f0f;
  color: #d8c892;
  font-family: Tahoma, sans-serif;
  text-align: center;
  line-height: 1.9;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 55px 20px;
}

h1 {
  color: #d4af37;
  font-size: 30px;
  margin-bottom: 15px;
}

.intro {
  margin-bottom: 50px;
}

.books {
  display: grid;
  grid-template-columns: repeat(auto-fit, 240px);
  justify-content: center;
  gap: 25px;
}

.book {
  background: #191919;
  border: 1px solid #8c7435;
  border-radius: 12px;
  padding: 25px 20px 30px;
}

.cover {
  width: 100%;
  max-width: 220px;
  aspect-ratio: 2 / 3;
  margin: 0 auto 20px;
  border: 1px solid #8c7435;
  border-radius: 5px;
  background: #252116;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #d4af37;
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.book h2 {
  color: #d4af37;
  font-size: 21px;
  margin: 10px 0;
}

.author {
  font-size: 15px;
  margin-bottom: 25px;
}

.download {
  display: inline-block;
  background: #d4af37;
  color: #111;
  padding: 9px 24px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
}

.download:hover {
  background: #e6c65b;
}

.back {
  display: inline-block;
  margin-top: 60px;
  color: #d4af37;
  text-decoration: none;
  }
@media (max-width: 750px) {
  .books {
    grid-template-columns: 240px;
    justify-content: center;
    margin: 0 auto;
  }

  .book {
    padding: 18px 12px 22px;
  }

  .cover {
    max-width: 180px;
  }

  .download {
    padding: 8px 12px;
    font-size: 13px;
    white-space: nowrap;
  }
}
</style>
</head>

<body>
<main class="container">

<h1>نبیگ‌های مهردار</h1>

<p class="intro">
